<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('perforacion', {
        schema: { profundidad: { type: 'number', default: 0 }, activo: { type: 'boolean', default: false }, brocaArriba: { type: 'boolean', default: false } },
        tick: function () {
          if (this.data.activo) {
            this.data.profundidad += 0.02; // Velocidad de perforación
            this.el.object3D.position.y = -this.data.profundidad;
            document.getElementById('profundidad').textContent = this.data.profundidad.toFixed(2) + ' m';
          }
        },
        startDrilling: function () {
          if (!this.data.brocaArriba) {
            this.data.activo = true;
          } else {
            alert("Baje la broca antes de iniciar la perforación");
          }
        },
        stopDrilling: function () {
          this.data.activo = false;
        },
        resetOperation: function () {
          this.data.profundidad = 0;
          this.el.object3D.position.y = 0;
          document.getElementById('profundidad').textContent = '0 m';
        },
        raiseDrill: function () {
          if (!this.data.activo) {
            this.data.brocaArriba = true;
            let el = this.el;
            let position = el.object3D.position;
            let speed = 0.1; // Velocidad de subida
            function animateUp() {
              if (position.y < 1) {
                position.y += speed;
                requestAnimationFrame(animateUp);
              } else {
                position.y = 1;
              }
            }
            animateUp();
          } else {
            alert("Debe detener la perforación antes de subir la broca");
          }
        },
        changeBit: function (bitType) {
          if (this.data.brocaArriba) {
            document.getElementById('broca').setAttribute('color', bitType);
            alert(`Broca cambiada a ${bitType}`);
            this.lowerDrill();
          } else {
            alert("Debe subir la broca antes de cambiarla");
          }
        },
        lowerDrill: function () {
          let el = this.el;
          let position = el.object3D.position;
          let targetDepth = -this.data.profundidad;
          let speed = 0.15; // Velocidad de bajada
          function animateDown() {
            if (position.y > targetDepth) {
              position.y -= speed;
              requestAnimationFrame(animateDown);
            } else {
              position.y = targetDepth;
              alert("Broca bajada a la profundidad alcanzada");
            }
          }
          animateDown();
          this.data.brocaArriba = false;
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <!-- Cámara -->
      <a-entity position="0 1.6 5">
        <a-camera></a-camera>
      </a-entity>

      <!-- Torre de perforación -->
      <a-cylinder position="0 3 -3" radius="0.5" height="6" color="#444"></a-cylinder>
      <a-box position="0 6 -3" width="2" height="1" depth="2" color="#222"></a-box>

      <!-- Broca -->
      <a-cylinder id="broca" position="0 0 -3" radius="0.2" height="1" color="#ff0000" perforacion></a-cylinder>
    </a-scene>

    <!-- Controles -->
    <div style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; color: white;">
      <p>Profundidad: <span id="profundidad">0 m</span></p>
      <button onclick="document.querySelector('#broca').components.perforacion.startDrilling()">Iniciar Perforación</button>
      <button onclick="document.querySelector('#broca').components.perforacion.stopDrilling()">Detener</button>
      <button onclick="document.querySelector('#broca').components.perforacion.resetOperation()">Reiniciar Operación</button>
      <button onclick="document.querySelector('#broca').components.perforacion.raiseDrill()">Subir Broca</button>
      <button onclick="document.querySelector('#broca').components.perforacion.changeBit('#0074ff')">Cambiar a Broca Tricónica</button>
      <button onclick="document.querySelector('#broca').components.perforacion.changeBit('#ff0000')">Cambiar a Broca PDC</button>
      <button onclick="document.querySelector('#broca').components.perforacion.changeBit('#ffb900')">Cambiar a Broca Diamante</button>
      <button onclick="document.querySelector('#broca').components.perforacion.changeBit('#000000')">Cambiar a Broca Sacatestigos</button>
      <button>Instalar Casing</button>
      <div class="slider-container">
        <label for="mud-density-slider">Densidad del lodo: <span id="mud-density-value">1.0</span> g/cm³</label>
        <input type="range" id="mud-density-slider" class="slider" min="0.8" max="2.5" step="0.1" value="1.0">
      </div>
      <div class="slider-container">
        <label for="rotation-speed-slider">Velocidad de rotación: <span id="rotation-speed-value">60</span> RPM</label>
        <input type="range" id="rotation-speed-slider" class="slider" min="10" max="2000" step="1" value="60">
      </div>
      <div class="slider-container">
        <label for="flow">Flujo de lodo: <span id="flow-value">250</span> L/min</label>
        <input type="range" id="flow" class="slider" min="0" max="500" step="10" value="250">
      </div>
      <div class="slider-container">
        <label for="wob-slider">Peso sobre la broca: <span id="wob-value">25</span> kN</label>
        <input type="range" id="wob-slider" class="slider" min="0" max="50" step="1" value="25">
      </div>
    </div>
  </body>
</html>
